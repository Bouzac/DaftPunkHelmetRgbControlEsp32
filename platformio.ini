; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit NeoMatrix@^1.3.3
	adafruit/Adafruit NeoPixel@^1.15.2
	h2zero/NimBLE-Arduino@^1.4.1
monitor_speed = 115200

; Two convenience environments so you can build/upload each helmet separately.
; Use the PlatformIO environment selector in VSCode or the CLI (see README below).
[env:helmetA]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit NeoMatrix@^1.3.3
	adafruit/Adafruit NeoPixel@^1.15.2
	h2zero/NimBLE-Arduino@^1.4.1
monitor_speed = 115200
; Only compile the helmet1 source file
build_src_filter = +<helmet1.cpp>

[env:helmetB]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit NeoMatrix@^1.3.3
	adafruit/Adafruit NeoPixel@^1.15.2
	h2zero/NimBLE-Arduino@^1.4.1
monitor_speed = 115200
; Only compile the helmet2 source file
build_src_filter = +<helmet2.cpp>
